<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Frame">
  <meta name="theme-color" content="#0b0f17">
  <title>Family Frame</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Bump ?v= on every change so iPads/frames load the new files instead of old saved copies. -->
  <link rel="stylesheet" href="css/style.css?v=2026-10-24b">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="clock">
        <div id="time">--:--</div>
        <div id="date"></div>
      </div>
      <div id="world-clocks"></div>
      <div id="laundry" class="wc"></div>
      <div id="weather" class="panel-ish">
        <div class="muted">Loading weather…</div>
      </div>
    </header>

    <section id="photos" class="panel">
      <div class="photo-layer" id="photo-a"></div>
      <div class="photo-layer" id="photo-b"></div>
      <div id="photo-empty" class="empty hidden">
        <div class="big">🖼️</div>
        <div>No photos yet.</div>
        <div class="muted small">Add pictures to your Google Drive photo folder (or the <code>photos/</code> folder) — see README.</div>
      </div>
      <button class="nav prev" id="photo-prev" aria-label="Previous photo">‹</button>
      <button class="nav next" id="photo-next" aria-label="Next photo">›</button>
      <button class="photo-pause" id="photo-pause" aria-label="Pause slideshow">❚❚</button>
      <div id="countdown" class="hidden"></div>
    </section>

    <section id="calendar" class="panel">
      <div class="cal-head">
        <h2 id="cal-title">📅 Calendar</h2>
        <div id="cal-nav" class="day-switch hidden">
          <div class="seg">
            <button id="cal-mode-day">Day</button>
            <button id="cal-mode-month">Month</button>
          </div>
          <button id="cal-today" class="today-btn hidden">Today</button>
          <button id="cal-prev" aria-label="Previous month">‹</button>
          <button id="cal-next" aria-label="Next month">›</button>
        </div>
      </div>
      <div id="cal-note"></div>
      <div id="calendar-body" class="scroll"><div class="muted">Loading calendar…</div></div>
    </section>

    <section id="hockey" class="panel">
      <div class="hockey-head">
        <div class="seg tabs">
          <button id="tab-hockey" class="on">🏒 Hockey</button>
          <button id="tab-countdown">⏳ Countdowns</button>
          <button id="tab-meals">🍽️ Meals</button>
        </div>
        <div class="day-switch hockey-only">
          <button id="hockey-day-prev" aria-label="Previous day">‹</button>
          <span id="hockey-day">Today</span>
          <button id="hockey-day-next" aria-label="Next day">›</button>
        </div>
      </div>
      <div id="hockey-card" class="scroll hockey-only"><div class="muted">Loading scores…</div></div>
      <div id="countdown-list" class="scroll hidden"></div>
      <div id="meals-list" class="scroll hidden"></div>
      <div class="hockey-foot hockey-only">
        <button class="nav-sm" id="game-prev" aria-label="Previous game">‹</button>
        <div id="game-dots"></div>
        <button class="nav-sm" id="game-next" aria-label="Next game">›</button>
      </div>
    </section>
  </div>

  <div id="night-dim"></div>

  <script src="js/config.js?v=2026-10-24b"></script>
  <script src="js/setup.js?v=2026-10-24b"></script>
  <script src="js/util.js?v=2026-10-24b"></script>
  <script src="js/clock.js?v=2026-10-24b"></script>
  <script src="js/weather.js?v=2026-10-24b"></script>
  <script src="js/calendar.js?v=2026-10-24b"></script>
  <script src="js/hockey.js?v=2026-10-24b"></script>
  <script src="js/photos.js?v=2026-10-24b"></script>
  <script src="js/tabs.js?v=2026-10-24b"></script>
  <script src="js/countdown.js?v=2026-10-24b"></script>
  <script src="js/meals.js?v=2026-10-24b"></script>
  <script src="js/laundry.js?v=2026-10-24b"></script>
  <script src="js/main.js?v=2026-10-24b"></script>
</body>
</html>
